# =====================================================
# CI - Integração Contínua (Sprint 4)
# Dispara a cada alteração na branch master:
# 1) baixa as chaves RSA da Library (Secure files)
# 2) executa os testes automatizados e publica o resultado
# 3) gera e publica o artefato (.jar)
# As chaves NÃO ficam no GitHub: só existem no Azure DevOps.
# =====================================================

trigger:
  - master

pool:
  vmImage: 'ubuntu-latest'

# Variáveis protegidas (Library > Variable groups > petcare-secrets)
variables:
  - group: petcare-secrets

steps:
  # Configurar Java 17
  - task: JavaToolInstaller@0
    displayName: 'Configurar Java 17'
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  # Baixar a chave privada (protegida na Library > Secure files)
  - task: DownloadSecureFile@1
    name: privateKey
    displayName: 'Baixar chave privada RSA'
    inputs:
      secureFile: 'private_key.pem'

  # Baixar a chave pública
  - task: DownloadSecureFile@1
    name: publicKey
    displayName: 'Baixar chave pública RSA'
    inputs:
      secureFile: 'public_key.pem'

  # Colocar as chaves dentro do projeto, para entrarem no .jar
  - script: |
      mkdir -p backend/src/main/resources/Keys
      cp "$(privateKey.secureFilePath)" backend/src/main/resources/Keys/private_key.pem
      cp "$(publicKey.secureFilePath)" backend/src/main/resources/Keys/public_key.pem
      ls -l backend/src/main/resources/Keys
    displayName: 'Copiar chaves para o projeto'

  # ETAPA DE TESTES: executa os testes automatizados (JUnit)
  - script: |
      chmod +x ./mvnw
      ./mvnw -B clean test
    workingDirectory: '$(Build.SourcesDirectory)/backend'
    displayName: 'Executar testes automatizados'
    env:
      DB_URL: $(DB_URL)
      DB_USERNAME: $(DB_USERNAME)
      DB_PASSWORD: $(DB_PASSWORD)

  # Publicar o resultado dos testes (aparece na aba "Tests" da execução)
  - task: PublishTestResults@2
    displayName: 'Publicar resultado dos testes'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      searchFolder: '$(Build.SourcesDirectory)/backend'
      testRunTitle: 'Testes automatizados - PetCare Hub'
      failTaskOnFailedTests: true

  # BUILD: gera o pacote .jar (os testes já rodaram na etapa anterior)
  - script: ./mvnw -B package -DskipTests
    workingDirectory: '$(Build.SourcesDirectory)/backend'
    displayName: 'Gerar pacote (.jar)'

  # Copiar o JAR para a pasta de publicação
  - task: CopyFiles@2
    displayName: 'Preparar artefato'
    inputs:
      SourceFolder: '$(Build.SourcesDirectory)/backend/target'
      Contents: '*.jar'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'

  # Publicar o artefato no Azure DevOps
  - task: PublishPipelineArtifact@1
    displayName: 'Publicar artefato'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifact: 'petcarehub-api'
      publishLocation: 'pipeline'